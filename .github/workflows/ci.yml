name: QA Suite (UI + API)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ui-tests:
    name: UI automation (Part A)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui-automation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui-automation/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run UI suite (all 4 scenarios, sequentially)
        run: npm test

      - name: Generate Allure report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: ui-automation/playwright-report/
          retention-days: 14

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: ui-automation/allure-report/
          retention-days: 14

  api-tests:
    name: API automation (Part D)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-automation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api-automation/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run API suite via Newman
        run: npm test

      - name: Upload Newman HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: api-automation/newman-report/
          retention-days: 14

  combined-summary:
    name: Combined run summary
    needs: [ui-tests, api-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Both suites completed
        run: echo "UI (Part A) and API (Part D) suites both ran in this workflow run."
